spring:
  application:
    name: laive

  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: "jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:laive}"
    username: "${POSTGRES_USER:laive}"
    password: "${POSTGRES_PASSWORD}"
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  data:
    redis:
      host: "${REDIS_HOST:127.0.0.1}"
      port: "${REDIS_PORT:6379}"
      database: "${REDIS_DATABASE:0}"
      connect-timeout: 2s
      timeout: 2s

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.example.laive.domain
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

laive:
  auth:
    naver:
      client-id: "${NAVER_CLIENT_ID:}"
      client-secret: "${NAVER_CLIENT_SECRET:}"
      redirect-uri: "${NAVER_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth/naver/callback}"
      authorization-uri: "https://nid.naver.com/oauth2.0/authorize"
      token-uri: "https://nid.naver.com/oauth2.0/token"
      user-info-uri: "https://openapi.naver.com/v1/nid/me"
    jwt:
      secret: "${JWT_SECRET}"
      access-token-ttl: 30m
      issuer: laive
    refresh-cookie:
      name: laive_refresh
      ttl: 14d
      secure: "${AUTH_COOKIE_SECURE:false}"
    allowed-return-uris: "${OAUTH_ALLOWED_RETURN_URIS:http://localhost:3000/oauth/callback}"
    oauth-state-ttl: 5m
