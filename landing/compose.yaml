services:
  landing:
    build:
      context: .
      dockerfile: Dockerfile
    image: laive-landing:latest
    container_name: laive-landing
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
