# LAIVE 배포용 nginx 설정 (호스트 nginx 1.24)
#
# 설치:
#   sudo cp deploy/nginx/laive.conf /etc/nginx/sites-available/laive
#   sudo ln -sf /etc/nginx/sites-available/laive /etc/nginx/sites-enabled/laive
#   sudo nginx -t && sudo systemctl reload nginx
#
# 인증서는 SSAFY가 미리 발급해 둔 와일드카드(*.p.ssafy.io)를 그대로 쓴다.
# certbot을 돌릴 필요가 없고, 따라서 80번 포트를 열 필요도 없다.
#
# 랜딩 페이지도 80을 열지 않는다. 브라우저는 주소창에 도메인만 입력하면 https부터
# 시도하므로 https 하나로 충분하고, `http://`를 명시한 링크 하나를 구제하려고
# 되돌리기 어려운 방화벽 조작을 하지는 않는다.
#
# 외부에 열린 포트는 443 하나뿐이다. 뒤쪽 컨테이너는 전부 127.0.0.1에만
# 바인딩되어 있어 이 파일을 거치지 않고는 닿을 수 없다.

# HTTP → HTTPS. UFW가 80을 막고 있어 실제로는 외부에서 오지 않지만,
# 방화벽이 열리는 날 평문으로 새는 것을 막아 두는 보험이다.
server {
    listen 80;
    listen [::]:80;
    server_name i15c204.p.ssafy.io;

    # $host가 아니라 도메인을 직접 박는다. 이 블록이 80번의 default_server가 되면
    # (sites-enabled에 다른 80번 블록이 없을 때) 임의의 Host 헤더도 여기로 들어오는데,
    # $host를 그대로 쓰면 공격자가 보낸 Host로 301을 내주게 된다(오픈 리다이렉트).
    # 지금은 UFW가 80을 막아 닿을 수 없지만, 위 "보험"이 실제로 보험이 되려면
    # 방화벽이 열리는 그날에 이미 안전해야 한다.
    return 301 https://i15c204.p.ssafy.io$request_uri;
}

server {
    # nginx 1.24에는 별도의 http2 지시어가 없다(1.25.1부터). listen에 붙인다.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name i15c204.p.ssafy.io;

    ssl_certificate     /etc/letsencrypt/live/p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/p.ssafy.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 클립 업로드 상한(laive.clip.max-upload-bytes = 200MB)보다 넉넉히 잡는다.
    # 기본값 1MB로 두면 업로드가 413으로 끊기는데, 요청이 Spring에 도달조차
    # 하지 않아 서버 로그에는 아무것도 남지 않는다 — 원인 찾기 가장 어려운 유형이다.
    client_max_body_size 220M;

    # 업로드 본문을 디스크에 통째로 받아 두지 않고 흘려보낸다(200MB 파일 기준
    # 지연과 디스크 쓰기를 줄인다).
    proxy_request_buffering off;

    access_log /var/log/nginx/laive.access.log;
    error_log  /var/log/nginx/laive.error.log;

    # ── 텍스트 응답 압축 ───────────────────────────────────────────
    # Ubuntu 기본 nginx.conf는 `gzip on`이지만 gzip_types가 주석 처리돼 있어
    # 기본값(text/html)만 압축된다. 즉 JS·CSS·JSON이 무압축으로 나간다.
    # 공개 웹 첫 로딩 실측(Lighthouse, slow 4G 실스로틀·5회 교차 측정 중앙값):
    #   전송량 803.2kB → 486.3kB (-39.5%), FCP 4111ms → 2423ms (-41.1%)
    # woff2는 이미 브로틀리로 압축된 컨테이너라 목록에서 뺀다 — 다시 압축해 봐야
    # CPU만 쓰고 크기는 오히려 늘어난다.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;                 # 캐시가 Accept-Encoding별로 응답을 구분하게 한다
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ── 음성 스트리밍 WebSocket → voice(8000) ─────────────────────
    # Upgrade/Connection 헤더가 없으면 WS 핸드셰이크가 성립하지 않는다.
    # 에러 없이 연결만 끊겨서 "AI가 응답을 안 한다"로 보인다.
    location /ws/audio {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 방송 내내 열려 있는 연결이다. 기본 60초면 말이 없는 구간에서 끊긴다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 오디오는 실시간이라 버퍼링하면 지연이 쌓인다.
        proxy_buffering off;
    }

    # ── REST API → spring(8080) ───────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        # LLM 리포트 생성이 수십 초 걸린다(growth roadmap timeout 30s).
        proxy_read_timeout 120s;
    }

    # ── 하이라이트 클립 → spring이 직접 서빙 ──────────────────────
    # ClipResourceConfig가 /clips/**를 파일로 내려준다. 인증 없이 열려 있다.
    location /clips/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 영상 파일이라 버퍼링을 끄고 그대로 흘려보낸다.
        proxy_buffering off;
    }

    # ── Electron 설치 파일 배포 ───────────────────────────────────
    # 서버에 미리 만들어 둔다 (DEPLOY.md 참고):
    #   sudo mkdir -p /var/www/laive/download
    #   sudo chown ubuntu:ubuntu /var/www/laive/download
    # 새 디렉터리만 만들 뿐 기존 시스템 디렉터리의 퍼미션은 건드리지 않는다.
    location /download/ {
        alias /var/www/laive/download/;
        autoindex on;               # 파일 목록을 브라우저에서 바로 볼 수 있게
        add_header Cache-Control "no-cache";
    }

    # ── 공개 웹 뷰(SC-10 포트폴리오 · SC-11 디렉터리) → 정적 파일 ──
    #
    # `pnpm build:web`의 산출물(out/web)을 올려 둔 것을 서빙한다. 서버에 미리 만든다:
    #   sudo mkdir -p /var/www/laive/web
    #   sudo chown ubuntu:ubuntu /var/www/laive/web
    # /download/와 같은 방식이다 — 새 디렉터리만 만들고 기존 퍼미션은 건드리지 않는다.
    #
    # API와 같은 오리진이라 CORS가 없다. src/web/.env의 VITE_API_ORIGIN을 비워 둬서
    # 요청이 `/api/v1` 상대 경로로 나가고 위쪽 `location /api/`가 받는다. 그래서 BE의
    # allowedReturnUris(=CORS 허용 오리진)에 추가할 것이 없다.
    #
    # 앱 전체가 아니라 이 두 화면만 웹에 올린다 — 로그인·콘솔·OBS 제어는 preload
    # 브릿지(window.api) 없이는 동작하지 않고, 스트리머 전용 화면을 브라우저에
    # 노출할 이유도 없다(src/web/WebApp.tsx 참고).

    # 해시가 박힌 빌드 산출물(JS·CSS·폰트).
    #
    # 이 블록이 없으면 /p/·/discover 는 200으로 뜨는데 스크립트를 못 받아 흰 화면이
    # 된다 — 원인이 화면에 아무것도 안 남아 찾기 가장 성가신 유형이다. 자산 경로가
    # 루트 기준(/assets/...)인 것은 vite.config.web.ts에 base를 두지 않았기 때문이고,
    # 랜딩 컨테이너에는 /assets/가 없어 지금은 충돌하지 않는다.
    location /assets/ {
        alias /var/www/laive/web/assets/;
        # 내용이 바뀌면 파일명 해시도 바뀐다. 그래서 영구 캐시가 안전하다.
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 공개 뷰는 BrowserRouter라(공유 링크가 /p/abc여야 하고 /#/p/abc면 어색하다)
    # /p/<slug>·/discover 가 디스크의 파일이 아니다. index.html로 폴백해야 한다.
    #
    # ⚠ try_files의 마지막 인자를 URI로 두면(`try_files $uri /index.html`) nginx가
    #   내부 리다이렉트를 걸고, /index.html이 아래 `location /`에 다시 매칭되어 랜딩
    #   컨테이너로 간다. 거기엔 그 파일이 없으니 결과는 404다 — "설정했는데 여전히
    #   404"로 보이는 함정이라 named location으로 받아 파일로 직접 끝낸다.
    location /p/ {
        root /var/www/laive/web;
        try_files $uri @public_web;
    }

    location /discover {
        root /var/www/laive/web;
        try_files $uri @public_web;
    }

    location @public_web {
        root /var/www/laive/web;
        # index.html은 배포마다 참조하는 자산 해시가 바뀌므로 캐시하지 않는다.
        # 이게 캐시되면 사용자가 옛 index.html로 사라진 자산을 요청하게 된다.
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # ── 그 외 경로 → 랜딩 페이지(landing, 8090) ────────────────────
    # 프록시 대상을 열거식으로만 두는 원칙은 그대로다. 여기서 8090(정적 파일만
    # 든 컨테이너)으로 보내지 8080으로 보내지 않으므로, /internal/**(AI·수집기
    # 전용)·/actuator/**·/swagger-ui/**는 여전히 Spring에 닿지 못한다.
    # 랜딩 컨테이너에 그 파일이 없으니 결과는 이전과 같은 404다 —
    # 랜딩 페이지가 나가는 것은 실제로 파일이 있는 "/" 뿐이다.
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
