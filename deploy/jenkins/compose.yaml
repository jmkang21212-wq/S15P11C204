services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: laive-jenkins:lts-jdk21-python
    container_name: laive-jenkins
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:8080"
    volumes:
      - jenkins-home:/var/jenkins_home
    environment:
      JAVA_OPTS: "-Djava.awt.headless=true"
      POSTGRES_HOST: jenkins-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: laive_ci
      POSTGRES_USER: laive_ci
      POSTGRES_PASSWORD: ${CI_POSTGRES_PASSWORD:?CI_POSTGRES_PASSWORD is required}
      REDIS_HOST: jenkins-redis
      REDIS_PORT: "6379"
      REDIS_DATABASE: "0"
      UV_CACHE_DIR: /var/jenkins_home/.cache/uv
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/login"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5
    depends_on:
      jenkins-postgres:
        condition: service_healthy
      jenkins-redis:
        condition: service_healthy

  jenkins-postgres:
    image: timescale/timescaledb:2.28.2-pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: laive_ci
      POSTGRES_USER: laive_ci
      POSTGRES_PASSWORD: ${CI_POSTGRES_PASSWORD:?CI_POSTGRES_PASSWORD is required}
      TZ: Asia/Seoul
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laive_ci -d laive_ci"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  jenkins-redis:
    image: redis:8.2.7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  jenkins-home:
    name: laive-jenkins-home
