# 로컬 개발용 덮어쓰기.
#
# docker compose는 이 파일이 있으면 compose.yaml과 **자동으로 합쳐서** 읽는다.
# 따라서 개발 중에는 아무것도 안 해도 되고, 배포에서만 제외하면 된다:
#
#   docker compose up -d                    # 개발 (이 파일 적용)
#   docker compose -f compose.yaml up -d    # 배포 (이 파일 무시)
#
# 하는 일 두 가지:
#   1. 소스를 컨테이너에 연결한다 → 코드를 고쳐도 재빌드가 필요 없다
#   2. --reload를 켠다 → 파일이 바뀌면 uvicorn이 스스로 재시작한다
# 이게 없으면 코드 한 줄 고칠 때마다 이미지를 다시 만들어야 해서 개발이 불가능하다.

services:
  voice:
    volumes:
      - ./app:/app/app
      - ./static:/app/static
      - ./logs:/app/logs
    command: ["uvicorn", "app.server:app", "--host", "0.0.0.0", "--port", "8000",
              "--reload", "--reload-dir", "/app/app"]
    restart: "no"        # 개발 중엔 죽으면 그대로 둔다. 재시작 루프가 로그를 덮어쓴다

  chat-ai:
    volumes:
      - ./chat-ai:/app/chat-ai
      - chatai-models:/app/chat-ai/models   # 소스 마운트가 models를 가리지 않게 다시 얹는다
      - ./logs:/app/logs
    command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8001",
              "--app-dir", "chat-ai", "--reload", "--reload-dir", "/app/chat-ai"]
    restart: "no"

  collector:
    volumes:
      - ./chat-collector:/app/chat-collector
      - ./logs:/app/logs
    command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8002",
              "--app-dir", "chat-collector", "--reload", "--reload-dir", "/app/chat-collector"]
    restart: "no"
