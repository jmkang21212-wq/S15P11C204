<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LAIVE · 스트리머 디렉터리</title>
    <meta
      name="description"
      content="협업하거나 광고를 진행할 스트리머를 찾아보세요. 방송 실적과 대표 클립을 공개 포트폴리오로 확인할 수 있습니다."
    />
    <!--
      Electron 쪽 index.html과 CSP를 따로 둔다. 웹은 자기 오리진에서 API를 부르므로
      ('self') localhost·AI 서버 주소가 필요 없고, 남겨 두면 공개 페이지에 내부 주소가
      노출된다.

      img-src에 https:를 열어 둔 이유는 프로필 이미지가 치지직 CDN에서 오기 때문이다.
      media-src는 클립 재생을 새 탭으로 넘기므로(desktopBridge.openExternal) 필요 없다.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: https:;
        connect-src 'self'
      "
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
