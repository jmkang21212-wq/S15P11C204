spring:
  application:
    name: laive

  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: "jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:laive}"
    username: "${POSTGRES_USER:laive}"
    password: "${POSTGRES_PASSWORD}"
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  data:
    redis:
      host: "${REDIS_HOST:127.0.0.1}"
      port: "${REDIS_PORT:6379}"
      database: "${REDIS_DATABASE:0}"
      connect-timeout: 2s
      timeout: 2s

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.example.laive.domain
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

laive:
  auth:
    naver:
      client-id: "${NAVER_CLIENT_ID:}"
      client-secret: "${NAVER_CLIENT_SECRET:}"
      redirect-uri: "${NAVER_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth/naver/callback}"
      authorization-uri: "https://nid.naver.com/oauth2.0/authorize"
      token-uri: "https://nid.naver.com/oauth2.0/token"
      user-info-uri: "https://openapi.naver.com/v1/nid/me"
    jwt:
      secret: "${JWT_SECRET}"
      access-token-ttl: 30m
      issuer: laive
    refresh-cookie:
      name: laive_refresh
      ttl: 14d
      secure: "${AUTH_COOKIE_SECURE:false}"
      # 회전(폐기) 직후 이 시간 안에 온 이전 토큰 재사용은 허용한다.
      # 메인 창과 미니 모드 창이 같은 쿠키로 동시에 refresh할 때 한쪽이 로그아웃되는 것을 막는다.
      rotation-grace: 60s
    allowed-return-uris: "${OAUTH_ALLOWED_RETURN_URIS:http://localhost:5173/oauth/callback}"
    oauth-state-ttl: 5m
    # 개발용 로그인(POST /api/v1/auth/dev/login). 로컬 개발에서만 true로 켠다.
    dev-login-enabled: "${DEV_LOGIN_ENABLED:false}"

  platform:
    chzzk:
      client-id: "${CHZZK_CLIENT_ID:}"
      client-secret: "${CHZZK_CLIENT_SECRET:}"
      redirect-uri: "${CHZZK_REDIRECT_URI:http://localhost:8080/api/v1/platform-accounts/chzzk/callback}"
      # 인증 화면만 OPEN API와 다른 도메인을 사용한다.
      authorization-uri: "https://chzzk.naver.com/account-interlock"
      token-uri: "https://openapi.chzzk.naver.com/auth/v1/token"
      revoke-uri: "https://openapi.chzzk.naver.com/auth/v1/token/revoke"
      user-me-uri: "https://openapi.chzzk.naver.com/open/v1/users/me"
    # NFR-S-03: 플랫폼 토큰은 이 키로 암호화해서 저장한다. Base64로 인코딩한 32바이트.
    token-encryption-key: "${PLATFORM_TOKEN_KEY:}"
    link-state-ttl: 5m
    access-token-refresh-threshold: 5m

  broadcast-session:
    # Redis Lock은 짧은 DB 트랜잭션만 감싸며 DB 제약이 최종 정합성을 보장한다.
    lifecycle-lock-ttl: 10s
    # 실제 수집기 Adapter는 종료 시각 이전의 지연 Batch를 이 기간 동안 Flush한다.
    finalization-grace-period: 30s
    # 종료된 실시간 콘솔 Stream은 재연결을 위해 잠시 유지한다.
    stream-ttl-after-end: 30m
    outbox:
      poll-delay-ms: 500
      batch-size: 50
      lease: 30s
      max-attempts: 8
      max-backoff: 5m

  # 수집기·AI 서버가 호출하는 /internal/** 수신 설정 (API 명세 13.1)
  internal:
    # 비어 있으면 /internal/**를 전부 401로 막는다. 설정 누락이 내부 API를
    # 여는 방향으로 실패하지 않게 한 의도적 선택이다.
    service-token: "${INTERNAL_SERVICE_TOKEN:}"
    # X-Request-Id 멱등 기록 보관 기간. 수집기 재시도 백오프(최대 수십 초)보다
    # 충분히 길고, 키가 무한정 쌓이지 않을 만큼 짧게 잡는다.
    request-id-ttl: 10m
    # 채팅 1초 배치가 이 수를 넘는 일은 없다. 사고성 대량 요청의 상한이다.
    max-batch-items: 1000

  # 채팅 감정 분류 AI(chat-ai, 기본 포트 8001) 호출 설정 (계약: AI/CHAT_AI_API.md)
  chat-ai:
    # 비어 있으면 AI를 연결하지 않는다(no-op). 채팅은 sentiment_label 없이 저장된다.
    base-url: "${CHATAI_BASE_URL:}"
    token: "${CHATAI_TOKEN:}"
    # 계약 권장 2초. 이 대기는 수집기 배치 응답 지연에 그대로 더해지므로,
    # 늘릴 때는 수집기 쪽 HTTP Timeout도 함께 조정해야 한다.
    ingest-timeout: 2s

  # 반복 질문 폴링·재질문 감지 (계약: AI/CHAT_AI_API.md §3)
  repeated-questions:
    # 계약 권장 10~30초. 변경분만 UPSERT라 짧게 잡아도 쓰기 부담이 없지만,
    # 질문 목록 자체가 임베딩 배치(최대 30초 지연) 주기로 천천히 변한다.
    poll-interval: 15s
    # 계약 최대치. exclude 없이 전량 받는다 — 답변 완료(dismissed)는 DB가 기억하고
    # 노출 단계에서 거른다. exclude로 걸러 받으면 세션 리포트에서 그 질문이 사라진다.
    limit: 50
    # 답변 직후에는 재질문 판정 기준(baseline)을 잡지 않는다: 송출 지연 4~5초에
    # 시청자 인지·타이핑 중이던 사람들의 관성 유입까지 흡수하는 유예다.
    dismiss-grace: 60s
    # 답변 후 이만큼 더 물으면 다시 노출한다. 중간 규모 채널 실측 기준 —
    # 시청자 수백 명대 채널에서는 도달하기 어려우니 규모별 조정 여지가 있다.
    reexpose-threshold: 10

  # CHAT_SURGE 하이라이트 판정 파라미터 (알고리즘: AI/chat-ai/HIGHLIGHT_SPEC.md)
  # 전부 백테스트 미검증 초기값이다. 실방송 DEBUG 로그(ts, engagement, z, state)가 튜닝 근거다.
  highlight:
    engage-window: 60s     # 유니크 채터 윈도우. ingest의 180초와 다른 이유는 스펙 §0
    baseline-size: 900     # 900틱 = 15분
    z-enter: 3.0
    enter-ticks: 3
    z-exit: 1.5
    exit-ticks: 15
    lead: 30s              # 확정 시 시작점 소급 — 반응은 원인보다 늦다
    max-active: 5m
    cooldown: 30s
    warmup: 3m             # 방송 시작 인사 러시 오탐 방지 (가드 1)
    min-window-chats: 10   # 저활동 틱 판정 생략 (가드 3)
    mad-epsilon: 0.001     # MAD 하한 (가드 2)
    tick-interval: 1s

  # Spring이 치지직 채팅 수집기 제어 서비스를 호출할 때 쓰는 설정
  collector:
    # 비어 있으면 수집기를 연결하지 않는다(no-op). 로컬에서 나머지 API만 돌릴 때 쓴다.
    base-url: "${COLLECTOR_BASE_URL:}"
    control-token: "${COLLECTOR_CONTROL_TOKEN:}"
    request-timeout: 5s
    # 수집기 상태 보고가 이 시간 넘게 끊기면 STOPPED로 간주한다.
    # 수집기 하트비트 주기(기본 10초)의 3배로 두어 한두 번의 유실로는 흔들리지 않게 한다.
    heartbeat-timeout: 30s
